<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El pollo loco</title>
    <link rel="icon" type="image/png" sizes="48x48" href="img/4_enemie_boss_chicken/3_attack/G18.png">
    <link rel="stylesheet" href="style.css">
</head>

<body onload="init()">
    <div class="background"></div>
    <div id="game-root">
        <div id="rotate-overlay" aria-hidden="true" role="dialog">
            <div class="rotate-bg" aria-hidden="true"></div>
            <div class="rotate-scrim" aria-hidden="true"></div>
            <div class="rotate-card" role="document">
                <svg class="rotate-icon" width="72" height="72" viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="6" y="3" width="12" height="18" rx="2" ry="2" fill="currentColor" opacity="0.15" />
                    <path d="M12 3 A9 9 0 0 1 21 12" fill="none" stroke="currentColor" stroke-width="2" opacity="0.5" />
                    <path d="M12 21 A9 9 0 0 1 3 12" fill="none" stroke="currentColor" stroke-width="2" opacity="0.5" />
                    <path d="M2 14 L3.999 11.999 L6 14" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
                    <path d="M18 10 L20.001 12.001 L22 10" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
                </svg>
                <h2>Rotate your device</h2>
                <p>Please rotate your device to <strong>landscape</strong> to play.</p>
            </div>
        </div>
        <canvas id="canvas" width="1080" height="720"></canvas>
        <img id="splash-start" src="img/9_intro_outro_screens/start/startscreen_2.png">
        <div id="hud-timer" class="hidden">00:00</div>
        <div id="hud-level" class="hidden">Level 1</div>
        <div id="instructions-overlay" class="hidden">
            <div class="overlay-box instructions-box">
                <button id="instructions-close" class="overlay-closebutton" aria-label="Close">
                    <span class="xbar one"></span>
                    <span class="xbar two"></span>
                </button>
                <button id="instructions-prev" class="circle-nav left" aria-label="Previous">
                    <span class="chev left"></span>
                </button>
                <div id="instructions-content" class="overlay-content"></div>
                <button id="instructions-next" class="circle-nav right" aria-label="Next">
                    <span class="chev right"></span>
                </button>
                <div class="overlay-footer">
                    <span id="instructions-page-indicator">Page 1 of 10</span>
                </div>
            </div>
        </div>
        <div id="leaderboard-overlay" class="hidden">
            <div class="overlay-box">
                <button id="leaderboard-close" class="overlay-closebutton" aria-label="Close">
                    <span class="xbar one"></span>
                    <span class="xbar two"></span>
                </button>
                <button id="leaderboard-prev" class="circle-nav left" aria-label="Previous">
                    <span class="chev left"></span>
                </button>
                <div id="leaderboard-content" class="overlay-content"></div>
                <button id="leaderboard-next" class="circle-nav right" aria-label="Next">
                    <span class="chev right"></span>
                </button>
                <div class="overlay-footer">
                    <span id="leaderboard-page-indicator">Page 1 of 6</span>
                </div>
            </div>
        </div>
        <div id="settings-overlay" class="hidden">
            <div class="overlay-box">
                <button id="settings-close" class="overlay-closebutton" aria-label="Close">
                    <span class="xbar one"></span>
                    <span class="xbar two"></span>
                </button>
                <div id="settings-content" class="overlay-content"></div>
            </div>
        </div>
        <div id="hamburger-root" class="hidden">
            <button id="hamburger-button" aria-label="Menu" aria-expanded="false">
                <span class="hamburger-bar top"></span>
                <span class="hamburger-bar middle"></span>
                <span class="hamburger-bar bottom"></span>
            </button>
            <nav id="hamburger-menu" class="hidden" aria-label="Quick Menu">
                <a href="#" id="menu-home">Home</a>
                <a href="#" id="menu-settings">Audio</a>
                <a href="#" id="menu-instructions">Instructions</a>
                <a href="legal/terms.html" target="_blank" rel="noopener" id="menu-terms">Terms of Service</a>
                <a href="legal/impressum.html" target="_blank" rel="noopener" id="menu-imprint">Imprint</a>
            </nav>
        </div>
        <img id="overlay-gameover" class="hidden" src="img/You won, you lost/Game over A.png" alt="Game Over">
        <div id="gameover-actions" class="hidden">
            <div class="overlay-box">
                <h2>Game Over</h2>
                <button id="btn-restart">Restart</button>
                <button id="btn-home-go">Home</button>
                <button id="btn-instructions-go">Instructions</button>
                <button id="btn-leaderboard-go">Leaderboard</button>
                <button id="btn-settings-go">Audio</button>
                <button id="btn-fullscreen-go">Fullscreen</button>
            </div>
        </div>
        <img id="overlay-youwin" class="hidden" src="img/You won, you lost/You Win A.png" alt="You Win">
        <div id="victory-actions" class="hidden">
            <div class="overlay-box">
                <h2>You Win!</h2>
                <button id="btn-next">Next Level</button>
                <button id="btn-restart-win">Restart</button>
                <button id="btn-home">Home</button>
                <button id="btn-instructions-victory">Instructions</button>
                <button id="btn-leaderboard-victory">Leaderboard</button>
                <button id="btn-settings-victory">Audio</button>
                <button id="btn-fullscreen-victory">Fullscreen</button>
            </div>
        </div>
        <div id="countdown" class="hidden">3</div>
        <div id="start-screen" class="hidden">
            <div class="overlay-box home-box">
                <h2 class="home-title">El Pollo Loco</h2>
                <div id="name-step">
                    <input id="player-name" placeholder="Name" />
                    <div id="name-error" class="hidden"></div>
                    <button id="btn-start" disabled>Start Game</button>
                </div>
                <div class="home-actions">
                    <button id="btn-instructions-home">Instructions</button>
                    <button id="btn-leaderboard-home">Leaderboard</button>
                    <button id="btn-settings-home">Audio</button>
                    <button id="btn-fullscreen-home">Fullscreen</button>
                </div>
                <div class="home-legal">
                    <a href="legal/terms.html" target="_blank" rel="noopener">Terms</a>
                    <span>•</span>
                    <a href="legal/impressum.html" target="_blank" rel="noopener">Imprint</a>
                </div>
            </div>
        </div>
        <div id="mobile-controls" class="mctrl">
            <div class="mctrl-left">
                <button id="btn-left" class="mctrl-btn is-left" aria-label="Left"></button>
                <button id="btn-right" class="mctrl-btn is-right" aria-label="Right"></button>
                <button id="btn-restart" class="mctrl-btn is-restart" aria-label="Restart"></button>
            </div>
            <div class="mctrl-right">
                <button id="btn-throw" class="mctrl-btn is-throw" aria-label="Throw"></button>
                <button id="btn-jump" class="mctrl-btn is-jump" aria-label="Jump"></button>
            </div>
        </div>
    </div>

    <script>
        (function () {
            const overlay = document.getElementById('rotate-overlay');
            function isTouch() {
                return window.matchMedia('(hover: none) and (pointer: coarse)').matches;
            }
            function isPortrait() {
                return window.matchMedia('(orientation: portrait)').matches;
            }
            function updateRotateOverlay() {
                const show = isTouch() && isPortrait();
                overlay.style.display = show ? 'flex' : 'none';
                overlay.setAttribute('aria-hidden', String(!show));
            }
            document.addEventListener('DOMContentLoaded', updateRotateOverlay);
            window.addEventListener('resize', updateRotateOverlay);
            window.addEventListener('orientationchange', updateRotateOverlay);
        })();
    </script>
